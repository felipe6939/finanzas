<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2a78d6">
  <link rel="apple-touch-icon" href="static/icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Finanzas personales</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Segoe UI,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
  <style>
    :root { --fondo: #fcfcfb; --tinta: #0b0b0b; --tinta2: #5b5b57; --primario: #2a78d6; --error: #c0392b; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #141413; --tinta: #f1f0ec; --tinta2: #a9a8a2; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta);
                 font: 15px/1.45 "Segoe UI", -apple-system, system-ui, sans-serif; }
    #vista { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none;
             padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); background: var(--fondo); }
    #carga { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
    .caja { text-align: center; max-width: 340px; }
    .marca { width: 56px; height: 56px; border-radius: 14px; background: var(--primario); color: #fff; margin: 0 auto 16px;
             display: grid; place-items: center; font-weight: 700; font-size: 28px; }
    #paso { color: var(--tinta2); margin: 8px 0 0; }
    #fallo { color: var(--error); white-space: pre-wrap; text-align: left; font-size: 13px; margin-top: 16px; display: none; }
    #ocupado { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--primario); z-index: 9;
               transition: width .4s ease; pointer-events: none; }
    #ocupado.activo { width: 70%; }
    body.ocupada #vista { pointer-events: none; }
  </style>
</head>
<body>
  <div id="ocupado"></div>
  <div id="carga" role="status" aria-live="polite">
    <div class="caja">
      <div class="marca">$</div>
      <strong>Finanzas personales</strong>
      <p id="paso">Preparando…</p>
      <div id="fallo"></div>
    </div>
  </div>
  <iframe id="vista" title="Finanzas personales"></iframe>
  <script type="module" src="motor.js"></script>
</body>
</html>
