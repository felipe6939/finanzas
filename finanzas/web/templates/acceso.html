<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="theme-color" content="#2a78d6">
  <link rel="apple-touch-icon" href="/static/icono-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Entrar · Finanzas personales</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body class="pagina-acceso">
  <main class="acceso">
    <div class="marca"><div class="logo">$</div><span>Finanzas</span></div>
    <h1>Entrar</h1>
    <p class="muted">Escribe tu clave de acceso para ver tus finanzas desde este dispositivo.</p>
    {% if error %}<div class="banda error" role="alert"><span class="icono">!</span><div>{{ error }}</div></div>{% endif %}
    <form method="post" action="/acceso">
      <input type="hidden" name="siguiente" value="{{ siguiente }}">
      <label for="clave">Clave de acceso</label>
      <input id="clave" type="password" name="clave" autocomplete="current-password" autofocus required>
      <button class="btn primario" style="width:100%;margin-top:12px">Entrar</button>
    </form>
    <p class="muted pequeno">La sesión dura 30 días en este dispositivo. Tus datos siguen en tu computador.</p>
  </main>
</body>
</html>
